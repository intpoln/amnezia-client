name: 'Fork Windows build'

on:
  push:
    branches:
      - 'custom'
      - 'feat/**'
      - 'fix/**'
    paths-ignore:
      - 'fork/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: fork-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/
  QT_VERSION: 6.10.1

jobs:
  Build-Windows:
    runs-on: windows-latest

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        tools: 'tools_ifw'
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup msvc'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: 'x64'

    - name: 'Setup .NET SDK'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 'Install WiX Toolset'
      shell: powershell
      run: |
        dotnet tool install --global wix --version 4.0.6
        wix extension add -g WixToolset.UI.wixext/4.0.6
        wix extension add -g WixToolset.Util.wixext/4.0.6
        $wixBinDir = Join-Path $env:USERPROFILE ".dotnet\tools"
        echo "WIX_BIN_DIR=$wixBinDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Build project'
      shell: cmd
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
        AMNEZIA_BUILD_TESTS: ON
        PROD_AGW_PUBLIC_KEY: ${{ secrets.PROD_AGW_PUBLIC_KEY }}
        PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
        FALLBACK_S3_ENDPOINT: ${{ secrets.FALLBACK_S3_ENDPOINT }}
      run: |
        set WIX_ROOT_PATH="${{ env.USERPROFILE }}\.dotnet\tools"
        deploy\build.bat --installer all

    - name: 'Upload IFW installer'
      uses: actions/upload-artifact@v7
      with:
        path: deploy/build/AmneziaVPN_*_windows_x64.exe
        archive: false
        retention-days: 14

    - name: 'Upload WIX installer'
      uses: actions/upload-artifact@v7
      with:
        path: deploy/build/AmneziaVPN_*_windows_x64.msi
        archive: false
        retention-days: 14

    - name: 'Run unit tests'
      shell: cmd
      run: |
        set QT_FORCE_STDERR_LOGGING=1
        set PATH=%PATH%;%CD%\client\3rd-prebuilt\deploy-prebuilt\windows\x64
        set PATH=%PATH%;%Qt6_DIR%\..\..\..\bin
        ctest --test-dir deploy\build\client\tests -C Release --output-on-failure --timeout 600 -R "^(SettingsSignalsTest|UiServersModelAndControllerTest|XrayServerInboundTest|XrayGeneratorMatrixTest|XrayConfigModelTest|ConfigFormatVersionTest|UiLanguageModelAndControllerTest|UiIpModelAndControllerTest|UiAppSTModelAndControllerTest|UiAllowedDnsModelAndControllerTest|FavoriteLocationsRestoreTest|OpenSSLLibraryTest|LogsControllerTest)$"
